<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our gallery – Gene Tents Ltd</title>
  <link rel="icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       1. THEME COLOURS
       ========================================================== */
    :root {
      --bg: #faf6f5;
      --surface: #fff;
      --ink: #241f2e;
      --muted: #675f6b;
      --line: #e6dcdb;
      --brand: #bf433e;
      --brand-ink: #fff;
      --navy: #3b3a7a;
      --navy-ink: #fff;
      --slot: #efe6e5;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17131a;
        --surface: #221c26;
        --ink: #f3eef2;
        --muted: #b8aeb9;
        --line: #3d3343;
        --brand: #d4574f;
        --navy: #6d6cc2;
        --slot: #2d2532;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #17131a;
      --surface: #221c26;
      --ink: #f3eef2;
      --muted: #b8aeb9;
      --line: #3d3343;
      --brand: #d4574f;
      --navy: #6d6cc2;
      --slot: #2d2532;
      color-scheme: dark;
    }

    /* ==========================================================
       2. BASE
       ========================================================== */
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 1.0625rem/1.6 Figtree, system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 30;
    }

    h1, h2, h3 {
      font-family: "Bricolage Grotesque", Figtree, system-ui, sans-serif;
      line-height: 1.1;
      margin: 0 0 .5em;
      letter-spacing: -.02em;
    }
    h1 { font-size: clamp(2.4rem, 7vw, 4.2rem); font-weight: 800; }
    h2 { font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 700; }
    h3 { font-size: 1.25rem; font-weight: 700; }

    p { margin: 0 0 1em; max-width: 62ch; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

    /* ==========================================================
       3. LAYOUT
       ========================================================== */
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    section { padding: 64px 0; }
    .band { background: var(--surface); border-block: 1px solid var(--line); }

    .split {
      display: grid;
      gap: 40px;
      grid-template-columns: 1fr 1fr;
      align-items: center;
    }

    .cards {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    /* ==========================================================
       4. HEADER & NAVIGATION
       ========================================================== */
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 0;
    }

    .logo {
      font: 800 1.3rem "Bricolage Grotesque", sans-serif;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo img { height: 44px; width: auto; }

    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav a {
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 500;
      color: var(--muted);
    }
    nav a:hover { background: var(--surface); }
    nav a[aria-current="page"] {
      color: var(--ink);
      background: var(--surface);
      box-shadow: inset 0 -3px 0 var(--brand);
    }

    /* ==========================================================
       5. BUTTONS & TAGS
       ========================================================== */
    .btn {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 10px;
      font: 600 1rem Figtree, sans-serif;
      text-decoration: none;
      border: 2px solid var(--brand);
      background: var(--brand);
      color: var(--brand-ink);
      cursor: pointer;
    }
    .btn.alt  { background: transparent; color: var(--ink); border-color: var(--ink); }
    .btn.navy { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }

    .tag {
      display: inline-block;
      font-size: .85rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--navy);
      color: var(--navy-ink);
      margin-bottom: 10px;
    }

    /* ==========================================================
       6. HERO
       ========================================================== */
    .hero { background: var(--brand); color: #fff; padding: 56px 0; }
    .hero .grid {
      display: grid;
      gap: 36px;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
    }
    .hero p { color: #fde3e1; font-size: 1.2rem; }
    .hero .acts { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero .btn { background: #fff; border-color: #fff; color: #8f2420; }
    .hero .btn.alt { background: transparent; color: #fff; }
    .hero .slot { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .5); }

    /* ==========================================================
       7. CARDS, IMAGE SLOTS & CALL TO ACTION
       ========================================================== */
    .slot { object-fit: cover; display: block; }
    .slot {
      background: var(--slot);
      border: 2px dashed var(--line);
      border-radius: 14px;
      aspect-ratio: 4 / 3;
      width: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
    }
    .card p { color: var(--muted); margin: 0; }
    .card .ic {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
    }
    .card .ic svg { width: 26px; height: 26px; }

    .cta {
      background: var(--navy);
      color: #fff;
      border-radius: 18px;
      padding: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .cta h2 { margin: 0; }
    .cta .btn { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* ==========================================================
       8. INNER PAGES (gallery, blog, contact)
       ========================================================== */
    .page-head { padding: 56px 0 8px; }
    .sub { color: var(--muted); }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
    .filters button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
      font: 500 .95rem Figtree, sans-serif;
    }
    .filters button[aria-pressed="true"] {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .gal { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .tile { margin: 0; }
    .tile .slot { border-radius: 14px; }
    .tile figcaption { padding: 10px 4px; font-weight: 500; }

    .post {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
      display: grid;
      gap: 20px;
      grid-template-columns: 220px 1fr;
    }
    .post .slot { aspect-ratio: 4 / 3; }
    .post time { color: var(--muted); font-size: .9rem; }
    .post summary { cursor: pointer; font-weight: 600; color: var(--navy); margin-top: 6px; }
    .post details p { margin-top: 12px; }

    form { display: grid; gap: 14px; }
    label { font-weight: 600; display: grid; gap: 6px; }
    input, select, textarea {
      font: inherit;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      width: 100%;
    }
    .info dt { font-weight: 700; margin-top: 16px; }
    .info dd { margin: 2px 0 0; color: var(--muted); }

    /* ==========================================================
       9. FOOTER & SOCIAL ICONS
       ========================================================== */
    footer { background: var(--navy); color: #fff; padding: 36px 0; }
    footer .wrap {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    footer img {
      height: 44px;
      background: #fff;
      border-radius: 8px;
      padding: 4px;
      vertical-align: middle;
      margin-right: 10px;
    }

    .social { display: flex; gap: 10px; flex-wrap: wrap; }
    .social a {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .14);
      display: grid;
      place-items: center;
      color: #fff;
    }
    .social a:hover { background: var(--brand); }
    .social svg { width: 20px; height: 20px; }

    /* ==========================================================
       10. RESPONSIVE & MOTION
       ========================================================== */
    @media (max-width: 800px) {
      .hero .grid, .split, .post { grid-template-columns: 1fr; }
      section { padding: 44px 0; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero h1 { animation: rise .7s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    }
  </style>
</head>

<body>

  <!-- ========================= SCRIPT ========================= -->
  <script>
    (function () {

      /* Gallery filter buttons (only runs on the gallery page) */
      var filters = document.getElementById("filters");
      var gallery = document.getElementById("gal");

      if (filters && gallery) {
        filters.addEventListener("click", function (e) {
          var btn = e.target.closest("button");
          if (!btn) return;

          filters.querySelectorAll("button").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn);
          });

          gallery.querySelectorAll(".tile").forEach(function (tile) {
            tile.hidden = !(btn.dataset.f === "all" || tile.dataset.t === btn.dataset.f);
          });
        });
      }

      /* Quote form: opens the visitor's email app (only runs on the contact page) */
      var form = document.getElementById("qf");

      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();

          var body =
            "Name: " + form.name.value + "\n" +
            "Phone: " + form.phone.value + "\n" +
            "Request: " + form.type.value + "\n\n" +
            form.msg.value;

          document.getElementById("note").textContent =
            "Opening your email app. If nothing opens, call us instead.";

          location.href =
            "mailto:info@genetents.example" +
            "?subject=" + encodeURIComponent("Quote request: " + form.type.value) +
            "&body=" + encodeURIComponent(body);
        });
      }

      /* Footer year */
      var year = document.getElementById("yr");
      if (year) year.textContent = new Date().getFullYear();

    })();
  </script>
